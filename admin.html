<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель</title>
<style>
  :root{
    --accent:#e4ae39; --accent-dim:#7a5b1c;
    --bg:#0b0c10; --panel:#15171d; --panel-2:#1c1f27; --line:#2a2d37;
    --text:#eceef2; --text-dim:#8b8f9c; --danger:#eb4b4b; --ok:#4be07a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 900px 500px at 50% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent), var(--bg);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh; padding:32px 16px 80px;
  }
  .wrap{max-width:1100px;margin:0 auto;}
  a{color:var(--accent);}

  /* ===== auth ===== */
  .auth-overlay{
    position:fixed;inset:0;z-index:200;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent), var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  body.authed .auth-overlay{display:none;}
  .auth-box{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px 26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .auth-box h1{margin:0 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:800;text-align:center;}
  .auth-box p{margin:0 0 22px;font-size:12px;color:var(--text-dim);text-align:center;}
  .auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .auth-field label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);}
  .auth-field input{background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:4px;font-size:14px;width:100%;}
  .auth-field input:focus{outline:none;border-color:var(--accent);}
  .auth-error{color:var(--danger);font-size:12px;min-height:16px;margin:-4px 0 12px;text-align:center;}
  .auth-submit{width:100%;background:var(--accent);border:none;color:#141414;padding:11px 18px;border-radius:4px;font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.05em;cursor:pointer;}
  .auth-submit:hover{filter:brightness(1.08);}
  .auth-submit:disabled{opacity:.6;cursor:not-allowed;}

  /* ===== shell ===== */
  body:not(.authed) .shell{display:none;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .topbar h1{font-size:clamp(20px,3vw,28px);font-weight:900;text-transform:uppercase;letter-spacing:.03em;margin:0;}
  .topbar .who{font-size:12.5px;color:var(--text-dim);}
  .topbar .who b{color:var(--accent);}
  .logout-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 16px;border-radius:4px;font-size:12.5px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;display:inline-block;text-decoration:none;}
  .logout-btn:hover{border-color:var(--danger);color:var(--danger);}
  .back-btn:hover{border-color:var(--accent);color:var(--accent);}

  .tabs{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab-btn{background:transparent;border:none;color:var(--text-dim);padding:11px 18px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:18px;}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim);margin:0 0 16px;font-weight:700;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);white-space:nowrap;}
  .field input[type=text], .field input[type=password], .field input[type=number], .field input[type=url]{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:4px;font-size:14px;
  }
  .field input:focus{outline:none;border-color:var(--accent);}
  .checkbox-field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);}
  .checkbox-field input{width:16px;height:16px;}

  .btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:9px 18px;border-radius:4px;font-weight:700;text-transform:uppercase;font-size:12.5px;letter-spacing:.05em;cursor:pointer;white-space:nowrap;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);color:#161616;border-color:var(--accent);}
  .btn.primary:hover{filter:brightness(1.1);color:#161616;}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.small{padding:6px 12px;font-size:11px;}

  .status-msg{font-size:12.5px;margin:10px 0 0;min-height:16px;}
  #tab-cases > .status-msg{margin:0 0 12px;}
  .status-msg.ok{color:var(--ok);}
  .status-msg.err{color:var(--danger);}

  /* ===== users table ===== */
  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em;}
  .badge.admin{background:color-mix(in srgb, var(--accent) 22%, transparent);color:var(--accent);border:1px solid var(--accent-dim);}
  .badge.user{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--line);}
  .pw-toggle{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;font-family:monospace;letter-spacing:2px;}
  .pw-toggle:hover{color:var(--accent);}
  .pw-reset-form{display:flex;gap:6px;align-items:center;margin-top:6px;}
  .pw-reset-form input{width:140px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12.5px;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .login-edit{background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:4px;font-size:13px;width:140px;}

  /* ===== cases ===== */
  .case-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:flex-end;}

  /* ===== галерея кейсов — перенесено из index.html/index3 один в один:
     сетка карточек с картинкой кейса вместо плоского списка текстом ===== */
  .case-selector-list{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
    gap:14px;
  }
  .case-card{
    display:flex;flex-direction:column;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;overflow:hidden;cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .case-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .case-header{
    height:64px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(120% 140% at 50% 0%, color-mix(in srgb, var(--item-color, var(--accent)) 32%, transparent), transparent 70%),
      var(--panel);
    border-bottom:1px solid var(--line);
  }
  .case-header img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
  .case-header .case-header-dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--item-color, var(--accent));
    box-shadow:0 0 12px color-mix(in srgb, var(--item-color, var(--accent)) 70%, transparent);
  }
  .case-content{padding:12px 12px 4px;text-align:center;flex:1 1 auto;}
  .case-content .case-name{font-size:13px;font-weight:700;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .case-content .case-stats{font-size:11px;color:var(--text-dim);}
  .case-actions{display:flex;gap:6px;margin:12px;margin-top:10px;}
  .case-btn{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:7px 8px;border-radius:6px;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.03em;font-weight:700;cursor:pointer;flex:1;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .case-btn:hover{border-color:var(--accent);color:var(--accent);}
  .case-btn.danger:hover{border-color:var(--danger);color:var(--danger);}

  /* ===== экран редактирования конкретного кейса — открывается кликом
     по карточке из галереи, вместо разворачивания прямо в списке ===== */
  #caseEditView .edit-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  #caseEditView .edit-head h2{margin:0;font-size:clamp(16px,2.4vw,20px);font-weight:900;text-transform:uppercase;letter-spacing:.03em;}

  .prize-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--row-color,var(--accent));padding:8px 12px;border-radius:4px;margin-bottom:7px;transition:background .15s ease,border-color .15s ease;}
  .prize-row .dot{width:14px;height:14px;border-radius:50%;background:var(--row-color,var(--accent));flex:0 0 auto;}
  .prize-row .pn{flex:1;font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .prize-row .pw{font-size:11.5px;color:var(--text-dim);width:64px;text-align:right;}
  .prize-row .pq{font-size:11px;color:var(--accent);width:44px;text-align:right;}
  .prize-row button{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:3px 5px;border-radius:5px;}
  .prize-row button:hover{color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, transparent);}
  .prize-row button.rm:hover{color:var(--danger);background:color-mix(in srgb, var(--danger) 14%, transparent);}
  .prize-row.editing{border-left-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--panel-2));}
  .empty-msg{color:var(--text-dim);font-size:12.5px;text-align:center;padding:14px 0;}

  /* ===== редкость приза — фиксированный набор вместо произвольного цвета,
     дизайн перенесён из index.html/index3 один в один под тему admin ===== */
  .edit-note{
    display:none;align-items:center;justify-content:space-between;gap:10px;
    background:color-mix(in srgb, var(--accent) 12%, var(--panel-2));
    border:1px solid var(--accent);border-radius:4px;
    padding:9px 14px;margin-bottom:14px;font-size:13px;color:var(--text);
  }
  .edit-note b{color:var(--accent);}
  .edit-note button{background:transparent;border:1px solid var(--line);color:var(--text-dim);border-radius:4px;padding:5px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;}
  .edit-note button:hover{border-color:var(--accent);color:var(--accent);}

  .add-form{display:flex;flex-direction:column;gap:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px;}
  .add-form-row{display:grid;grid-template-columns:1.6fr 1fr .8fr .8fr auto;gap:12px;align-items:end;}
  .add-form .field input[readonly]{color:var(--text-dim);cursor:not-allowed;background:color-mix(in srgb, var(--panel) 80%, black);}
  @media (max-width:820px){
    .add-form-row{grid-template-columns:1fr 1fr;}
    .field-name,.field-actions{grid-column:1/-1;}
  }
  @media (max-width:460px){ .add-form-row{grid-template-columns:1fr;} }

  .field-rarity-wrap{gap:8px;}
  .rarity-picker{display:flex;flex-wrap:wrap;gap:8px;}
  .rarity-pill{
    display:flex;align-items:center;gap:7px;
    background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
    padding:8px 13px;border-radius:20px;font-size:12.5px;font-weight:700;
    cursor:pointer;white-space:nowrap;
    transition:border-color .15s ease,color .15s ease,background .15s ease;
  }
  .rarity-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .rarity-pill:hover{color:var(--text);border-color:color-mix(in srgb, var(--pill-color, var(--accent)) 60%, var(--line));}
  .rarity-pill.is-active{
    color:var(--text);
    border-color:var(--pill-color, var(--accent));
    background:color-mix(in srgb, var(--pill-color, var(--accent)) 16%, var(--panel));
    box-shadow:0 0 0 1px color-mix(in srgb, var(--pill-color, var(--accent)) 40%, transparent);
  }
  .add-btn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:9px 18px;border-radius:4px;font-weight:700;text-transform:uppercase;
    font-size:12.5px;letter-spacing:.05em;cursor:pointer;white-space:nowrap;
    transition:border-color .15s ease,color .15s ease,background .15s ease,filter .15s ease;
  }
  .add-btn:hover{border-color:var(--accent);color:var(--accent);}
  .add-btn.primary{background:var(--accent);color:#161616;border-color:var(--accent);}
  .add-btn.primary:hover{filter:brightness(1.1);color:#161616;}
  .prize-row .thumb-row{width:26px;height:26px;object-fit:cover;border-radius:5px;flex:0 0 auto;border:1px solid var(--row-color,var(--accent));}
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h1>Админ-панель</h1>
    <p>Войдите аккаунтом с правами администратора</p>
    <form id="authForm" autocomplete="off">
      <div class="auth-field">
        <label>Логин</label>
        <input type="text" id="authLogin" autocomplete="username" autofocus>
      </div>
      <div class="auth-field">
        <label>Пароль</label>
        <input type="password" id="authPassword" autocomplete="current-password">
      </div>
      <div class="auth-error" id="authError"></div>
      <button type="submit" class="auth-submit" id="authSubmit">Войти</button>
    </form>
  </div>
</div>

<div class="wrap shell">
  <div class="topbar">
    <h1>Админ-панель</h1>
    <div style="display:flex;align-items:center;gap:14px;">
      <span class="who">Вы вошли как <b id="whoAmI"></b></span>
      <a href="index.html" class="logout-btn back-btn" id="btnBackToSite">← К кейсам</a>
      <button type="button" class="logout-btn" id="btnLogout">Выйти</button>
    </div>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="users">Аккаунты</button>
    <button type="button" class="tab-btn" data-tab="cases">Кейсы</button>
  </div>

  <!-- ===== ACCOUNTS ===== -->
  <div class="tab-panel active" id="tab-users">
    <div class="panel">
      <h2>Создать аккаунт</h2>
      <div class="row">
        <div class="field"><label>Логин</label><input type="text" id="newLogin" placeholder="login"></div>
        <div class="field"><label>Пароль</label><input type="text" id="newPassword" placeholder="мин. 6 символов"></div>
        <div class="field checkbox-field" style="padding-bottom:9px;">
          <input type="checkbox" id="newIsAdmin"><label for="newIsAdmin" style="text-transform:none;letter-spacing:0;font-size:13px;">Права администратора</label>
        </div>
        <button type="button" class="btn primary" id="btnCreateUser">Создать</button>
      </div>
      <div class="status-msg" id="userCreateStatus"></div>
    </div>

    <div class="panel">
      <h2>Все аккаунты</h2>
      <p style="font-size:12px;color:var(--text-dim);margin:-8px 0 14px;">
        Пароли хранятся как необратимый хеш (PBKDF2) — показать существующий пароль нельзя,
        только задать новый.
      </p>
      <table>
        <thead><tr><th>Логин</th><th>Пароль</th><th>Роль</th><th>Создан</th><th>Действия</th></tr></thead>
        <tbody id="usersTableBody"></tbody>
      </table>
      <div class="status-msg" id="usersStatus"></div>
    </div>
  </div>

  <!-- ===== CASES ===== -->
  <div class="tab-panel" id="tab-cases">
    <div class="status-msg" id="casesStatus"></div>
    <div class="panel" id="caseGridView">
      <h2>Кейсы</h2>
      <div class="case-toolbar">
        <button type="button" class="btn primary" id="btnNewCase">+ Создать кейс</button>
        <div class="field"><label>Импорт из JSON (URL)</label><input type="url" id="importUrl" style="width:340px;" value="https://raw.githubusercontent.com/SaportBati/CaseSamp/refs/heads/main/cases.json"></div>
        <button type="button" class="btn" id="btnImport">Импортировать</button>
      </div>
      <div class="case-selector-list" id="caseGrid"></div>
    </div>

    <div class="panel" id="caseEditView" style="display:none;">
      <div class="edit-head">
        <button type="button" class="logout-btn back-btn" id="btnBackToGrid">← К кейсам</button>
        <h2 id="caseEditTitle"></h2>
      </div>
      <div id="caseEditorContainer"></div>
    </div>
  </div>
</div>

<script>
const API_BASE_URL = 'https://curly-tooth-4ec5.aaf60251.workers.dev/api';

// ===== картинки призов =====
// Тот же список и та же логика, что в index.html — картинки лежат в
// репозитории на GitHub, тут только имена файлов. Список картинок нужно
// держать в синхроне вручную между index.html и admin.html (оба файла
// самостоятельные, общего конфига между ними нет).
window.IMAGES_BASE_URL = "https://raw.githubusercontent.com/SaportBati/CaseSamp/refs/heads/main/";
window.CASE_IMAGES = [
  "azp.png",
];
window.resolveImageUrl = function(src){
  if (!src) return '';
  let url = src.trim();
  const blobMatch = url.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^?]+)/i);
  if (blobMatch){
    url = `https://raw.githubusercontent.com/${blobMatch[1]}/${blobMatch[2]}/${blobMatch[3]}`;
  }
  return /^https?:\/\//i.test(url) ? url : (window.IMAGES_BASE_URL + url);
};

// ===== редкость призов =====
// Набор редкостей и их цвета — синхронизированы с index.html (тот же
// rarity-picker, те же id/цвета), чтобы кейс выглядел одинаково что на
// сайте, что здесь. Цвет приза больше не задаётся вручную — только
// редкость из этого списка, цвет подставляется по ней автоматически.
const RARITIES = [
  { id: 'common',    label: 'Обычный',     color: '#9da3ae' },
  { id: 'rare',      label: 'Редкий',      color: '#4be07a' },
  { id: 'unique',    label: 'Уникальный',  color: '#8847ff' },
  { id: 'legendary', label: 'Легендарный', color: '#e4ae39' },
  { id: 'secret',    label: 'Секретный',   color: '#eb4b4b' },
];
const RARITY_BY_ID = Object.fromEntries(RARITIES.map(r => [r.id, r]));
function rarityInfo(id){ return RARITY_BY_ID[id] || RARITY_BY_ID.common; }

// ===== вес (шанс выпадения) теперь жёстко привязан к редкости =====
// Ручного ввода шанса/веса больше нет — выбрал редкость, вес подставился
// сам. Распределение как в index3: ни одна редкость не уходит ниже 1%,
// недостающее у легендарного/секретного забирается из запаса обычного.
// 79% common + 15% rare + 4% unique + 1% legendary + 1% secret = 100%
const RARITY_WEIGHTS = {
  common: 79,
  rare: 15,
  unique: 4,
  legendary: 1,
  secret: 1
};
const RARITY_TOTAL_WEIGHT = Object.values(RARITY_WEIGHTS).reduce((s,w)=>s+w,0);
const RARITY_ORDER = ['secret','legendary','unique','rare','common'];
function weightForRarityId(id){ return RARITY_WEIGHTS[id] || RARITY_WEIGHTS.common; }
function formatChancePercent(weight){
  const pct = (weight / RARITY_TOTAL_WEIGHT) * 100;
  return (pct >= 1 ? pct.toFixed(1) : pct.toFixed(2)).replace(/\.0+$/,'') + '%';
}
function rarityIdByWeight(weight){
  // для старых призов, у которых вес не совпадает ни с одной редкостью
  // "чисто" — подбираем ближайшую по величине, только для визуальной сортировки
  let best = 'common', bestDiff = Infinity;
  RARITIES.forEach(r=>{
    const d = Math.abs(weightForRarityId(r.id) - weight);
    if (d < bestDiff){ bestDiff = d; best = r.id; }
  });
  return best;
}

let token = null;
let me = null;

function authHeaders(){
  const h = { 'Content-Type': 'application/json' };
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}

async function api(path, opts){
  opts = opts || {};
  const res = await fetch(API_BASE_URL + path, {
    method: opts.method || 'GET',
    headers: authHeaders(),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok){
    throw new Error((data && data.error) ? data.error : ('HTTP ' + res.status));
  }
  return data;
}

function setStatus(el, msg, isErr){
  el.textContent = msg || '';
  el.className = 'status-msg ' + (isErr ? 'err' : (msg ? 'ok' : ''));
}

const authSubmit = document.getElementById('authSubmit');
const whoAmI = document.getElementById('whoAmI');
const btnLogout = document.getElementById('btnLogout');

function saveSession(t, user){
  token = t; me = user;
  try{
    localStorage.setItem('case_opener_token', t);
    localStorage.setItem('case_opener_user', JSON.stringify(user));
  }catch(e){}
}

function clearSession(){
  token = null; me = null;
  try{
    localStorage.removeItem('case_opener_token');
    localStorage.removeItem('case_opener_user');
  }catch(e){}
}

async function tryRestoreSession(){
  try{
    const t = localStorage.getItem('case_opener_token');
    if (!t) return false;
    token = t;
    const profile = await api('/auth/profile');
    if (!profile.isAdmin){
      authError.textContent = 'У этого аккаунта нет прав администратора';
      clearSession();
      return false;
    }
    me = profile;
    return true;
  }catch(e){
    clearSession();
    return false;
  }
}

async function enterApp(){
  document.body.classList.add('authed');
  whoAmI.textContent = me.login;
  await Promise.all([loadUsers(), loadCases()]);
}

authForm.addEventListener('submit', async function(e){
  e.preventDefault();
  authError.textContent = '';
  authSubmit.disabled = true;
  try{
    const res = await fetch(API_BASE_URL + '/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ login: authLogin.value.trim(), password: authPassword.value })
    });
    const data = await res.json();
    if (!res.ok || !data.token){
      authError.textContent = (data && data.error) ? data.error : 'Неверный логин или пароль';
      authSubmit.disabled = false;
      return;
    }
    if (!data.user || !data.user.isAdmin){
      authError.textContent = 'У этого аккаунта нет прав администратора';
      authSubmit.disabled = false;
      return;
    }
    saveSession(data.token, data.user);
    await enterApp();
  }catch(err){
    authError.textContent = 'Не удалось связаться с сервером';
  }
  authSubmit.disabled = false;
});

btnLogout.addEventListener('click', function(){

});

      cancel.className = 'btn small';
      cancel.type = 'button';
      cancel.textContent = 'Отмена';
      cancel.onclick = ()=>{ revealedPwId = null; renderUsers(); };
      form.appendChild(input); form.appendChild(save); form.appendChild(cancel);
      wrap.innerHTML = '<div style="font-size:11px;color:var(--text-dim);margin-bottom:2px;">хеш скрыт — задайте новый пароль</div>';
      wrap.appendChild(form);

      btn.className = 'pw-toggle';
      btn.type = 'button';
      btn.textContent = '••••••  сменить';
      btn.onclick = ()=>{ revealedPwId = u.id; renderUsers(); };

    const tdActions = document.createElement('td');

    const btnRole = document.createElement('button');
    btnRole.className = 'btn small';
    btnRole.type = 'button';
    btnRole.textContent = u.isAdmin ? 'Забрать админку' : 'Сделать админом';

      try{
        await api('/admin/users/' + u.id, { method:'PUT', body:{ isAdmin: !u.isAdmin } });
        setStatus(usersStatus, 'Роль обновлена для «' + u.login + '»');
        loadUsers();
      }catch(e){ setStatus(usersStatus, e.message, true); }
    };

    const btnRename = document.createElement('button');
    btnRename.className = 'btn small';
    btnRename.type = 'button';

const caseGrid = document.getElementById('caseGrid');

const btnBackToGrid = document.getElementById('btnBackToGrid');
const casesStatus = document.getElementById('casesStatus');
let casesCache = [];
let openCaseId = null;

async function loadCases(){
  try{
    casesCache = await api('/cases');
    if (openCaseId !== null && caseEditView.style.display !== 'none'){
      // Если сейчас открыт экран редактирования конкретного кейса —
      // перерисовываем именно его (со свежими данными), а не улетаем
      // обратно в галерею.
      const c = casesCache.find(x => x.id === openCaseId);
      if (c){ renderCaseEditor(c); return; }
      openCaseId = null;
    }
    renderCaseGrid();
  }catch(e){
    setStatus(casesStatus, 'Ошибка загрузки: ' + e.message, true);
  }
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== галерея кейсов — карточка с картинкой, как в index.html/index3,
// вместо плоского текстового списка. Клик по карточке открывает экран
// редактирования этого кейса. =====
function renderCaseGrid(){
  caseGrid.innerHTML = '';
  if (!casesCache.length){
    caseGrid.innerHTML = '<div style="grid-column:1/-1;"><p class="empty-msg">Кейсов пока нет — создайте новый или импортируйте из JSON</p></div>';
    return;
  }
  casesCache.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'case-card';
    card.style.setProperty('--item-color', c.color || '#e4ae39');
    card.title = 'Открыть «' + c.name + '» для редактирования';
    card.addEventListener('click', ()=> openCaseEditor(c.id));

    const header = document.createElement('div');
    header.className = 'case-header';
    if (c.image){
      const img = document.createElement('img');
      img.src = window.resolveImageUrl(c.image);
      img.alt = '';
      img.onerror = function(){
        const dot = document.createElement('span'); dot.className = 'case-header-dot';
        img.replaceWith(dot);
      };
      header.appendChild(img);
    } else {
      const dot = document.createElement('span');
      dot.className = 'case-header-dot';
      header.appendChild(dot);
    }

    const content = document.createElement('div');
    content.className = 'case-content';
    const nameEl = document.createElement('div'); nameEl.className = 'case-name'; nameEl.textContent = c.name;
    const statsEl = document.createElement('div'); statsEl.className = 'case-stats'; statsEl.textContent = (c.prizes ? c.prizes.length : 0) + ' призов';
    content.appendChild(nameEl); content.appendChild(statsEl);

    const actions = document.createElement('div');
    actions.className = 'case-actions';
    const btnDelete = document.createElement('button');
    btnDelete.type = 'button'; btnDelete.className = 'case-btn danger'; btnDelete.textContent = 'Удалить';
    btnDelete.onclick = async (e)=>{
      e.stopPropagation();
      if (!confirm('Удалить кейс «' + c.name + '» вместе со всеми призами?')) return;
      try{
        await api('/admin/cases/' + c.id, { method:'DELETE' });
        setStatus(casesStatus, 'Кейс удалён');
        loadCases();
      }catch(err){ setStatus(casesStatus, err.message, true); }
    };
    actions.appendChild(btnDelete);

    card.appendChild(header);
    card.appendChild(content);
    card.appendChild(actions);
    caseGrid.appendChild(card);
  });
}

function openCaseEditor(caseId){
  openCaseId = caseId;
  const c = casesCache.find(x => x.id === caseId);

  caseGridView.style.display = 'none';
  caseEditView.style.display = 'block';

function showCaseGrid(){

function buildCaseEditor(c){
  const wrap = document.createElement('div');

  const inColor = document.createElement('input'); inColor.type='text'; inColor.value = c.color || '#e4ae39'; inColor.style.width='90px';
  fColor.appendChild(inColor);

  const fImage = document.createElement('div'); fImage.className = 'field'; fImage.style.flex='1 1 220px';

  const btnDeleteCase = document.createElement('button');
  btnDeleteCase.className = 'btn danger'; btnDeleteCase.type='button'; btnDeleteCase.textContent = 'Удалить кейс';
  btnDeleteCase.onclick = async ()=>{
    if (!confirm('Удалить кейс «' + c.name + '» вместе со всеми призами?')) return;
    try{
      await api('/admin/cases/' + c.id, { method:'DELETE' });
      setStatus(casesStatus, 'Кейс удалён');
      await loadCases();
      showCaseGrid();
    }catch(e){ setStatus(casesStatus, e.message, true); }
  };

  row.appendChild(fName); row.appendChild(fColor); row.appendChild(fImage);
  row.appendChild(btnSaveCase); row.appendChild(btnDeleteCase);
  wrap.appendChild(row);

  // --- prize add/edit form -----------------------------------------
  // Единая форма для добавления и редактирования приза — дизайн (пилюли
  // редкости, залоченный шанс) перенесён из index.html/index3. Редкость
  // выбирается пилюлями вместо select'а, шанс больше не вводится вручную —
  // он жёстко определяется выбранной редкостью (см. RARITY_WEIGHTS выше).
  // Правки приза теперь делаются прямо в этой форме, а не через prompt().
  const editorPanel = document.createElement('div');
  editorPanel.className = 'add-form';

  const editNote = document.createElement('div');
  editNote.className = 'edit-note';
  editNote.innerHTML = '<span>Редактируешь приз: <b class="editNoteName"></b></span>';
  const btnCancelNote = document.createElement('button');
  btnCancelNote.type = 'button'; btnCancelNote.textContent = 'Отмена';
  editNote.appendChild(btnCancelNote);
  editorPanel.appendChild(editNote);

  const pfRarity = document.createElement('div'); pfRarity.className = 'field field-rarity-wrap';
  pfRarity.innerHTML = '<label>Редкость приза</label>';
  const rarityPicker = document.createElement('div'); rarityPicker.className = 'rarity-picker';
  let activeRarity = 'common';
  const rarityPills = RARITIES.map(r=>{
    const pill = document.createElement('button');
    pill.type = 'button'; pill.className = 'rarity-pill';
    pill.style.setProperty('--pill-color', r.color);
    pill.innerHTML = '<span class="rarity-dot" style="background:' + r.color + ';"></span>' + r.label;
    pill.dataset.rarity = r.id;
    pill.addEventListener('click', ()=> setActiveRarity(r.id));
    rarityPicker.appendChild(pill);
    return pill;
  });
  pfRarity.appendChild(rarityPicker);
  editorPanel.appendChild(pfRarity);

  const formRow = document.createElement('div'); formRow.className = 'add-form-row';
  const mkField = (labelText, cls) => {
    const f = document.createElement('div'); f.className = 'field ' + cls;
    f.innerHTML = '<label>' + labelText + '</label>';
    return f;
  };

  const pfName = mkField('Название приза','field-name');
  const pInName = document.createElement('input'); pInName.type='text'; pInName.placeholder='Например: AK-47 | Огонь'; pInName.maxLength=60;
  pfName.appendChild(pInName);

  const pfImage = mkField('Картинка','field-image');
  const pInImage = document.createElement('select');
  pInImage.style.background='var(--panel-2)'; pInImage.style.border='1px solid var(--line)';
  pInImage.style.color='var(--text)'; pInImage.style.padding='9px 10px'; pInImage.style.borderRadius='4px'; pInImage.style.fontSize='14px'; pInImage.style.width='100%';
  const optNone = document.createElement('option'); optNone.value=''; optNone.textContent='Нет';
  pInImage.appendChild(optNone);
  (Array.isArray(window.CASE_IMAGES) ? window.CASE_IMAGES : []).forEach(name=>{
    const opt = document.createElement('option'); opt.value = name; opt.textContent = name;
    pInImage.appendChild(opt);
  });
  pfImage.appendChild(pInImage);

  const pfWeight = mkField('Шанс (по редкости)','field-weight');
  const inWeight = document.createElement('input'); inWeight.type='text'; inWeight.readOnly = true;
  pfWeight.appendChild(inWeight);

  const pfQty = mkField('Кол-во','field-qty');
  const inQty = document.createElement('input'); inQty.type='number'; inQty.min='0'; inQty.max='99999'; inQty.placeholder='∞';
  pfQty.appendChild(inQty);

  const pfActions = mkField('\u00A0','field-actions');
  const actionsRow = document.createElement('div'); actionsRow.className='field-actions-row';
  const btnSubmit = document.createElement('button'); btnSubmit.type='button'; btnSubmit.className='add-btn primary'; btnSubmit.textContent='+ Приз';
  const btnCancel = document.createElement('button'); btnCancel.type='button'; btnCancel.className='add-btn'; btnCancel.textContent='Отмена'; btnCancel.style.display='none';
  actionsRow.appendChild(btnSubmit); actionsRow.appendChild(btnCancel);
  pfActions.appendChild(actionsRow);

  formRow.appendChild(pfName); formRow.appendChild(pfImage); formRow.appendChild(pfWeight); formRow.appendChild(pfQty); formRow.appendChild(pfActions);
  editorPanel.appendChild(formRow);
  wrap.appendChild(editorPanel);

  function setActiveRarity(id){
    activeRarity = RARITY_BY_ID[id] ? id : 'common';
    rarityPills.forEach(p=> p.classList.toggle('is-active', p.dataset.rarity === activeRarity));
    inWeight.value = formatChancePercent(weightForRarityId(activeRarity));
  }
  setActiveRarity('common');

  let editingPrizeId = null;

  function resetForm(){
    editingPrizeId = null;
    pInName.value = ''; pInImage.value = ''; inQty.value = '';
    setActiveRarity('common');
    btnSubmit.textContent = '+ Приз';
    btnCancel.style.display = 'none';
    editNote.style.display = 'none';
    editorPanel.style.borderColor = '';
    renderList();
  }

  function enterEdit(p){
    editingPrizeId = p.id;
    pInName.value = p.name;
    pInImage.value = p.image || '';
    inQty.value = (p.qty===null || p.qty===undefined) ? '' : p.qty;
    setActiveRarity(p.rarity || 'common');
    btnSubmit.textContent = 'Сохранить';
    btnCancel.style.display = 'inline-block';
    editNote.style.display = 'flex';
    editNote.querySelector('.editNoteName').textContent = p.name;
    editorPanel.style.borderColor = 'var(--accent)';
    renderList();
    editorPanel.scrollIntoView({behavior:'smooth', block:'center'});
    pInName.focus();
  }

  btnCancel.addEventListener('click', resetForm);
  btnCancelNote.addEventListener('click', resetForm);
  pInName.addEventListener('keydown', (e)=>{ if(e.key==='Enter') btnSubmit.click(); });

  btnSubmit.addEventListener('click', async ()=>{
    const name = pInName.value.trim();
    if (!name) { pInName.focus(); return; }
    // Шанс больше не вводится вручную — берём вес из выбранной редкости.
    // Цвет отправляем явно (а не только rarity id) — так подстановка не
    // зависит от того, знает ли бэкенд про новый набор редкостей.
    const weight = weightForRarityId(activeRarity);
    const body = {
      name, rarity: activeRarity, color: rarityInfo(activeRarity).color,
      image: pInImage.value.trim(), weight,
      qty: inQty.value.trim() === '' ? null : parseInt(inQty.value,10)
    };
    try{
      if (editingPrizeId !== null){
        await api('/admin/prizes/' + editingPrizeId, { method:'PUT', body });
        setStatus(casesStatus, 'Приз обновлён');
      } else {
        await api('/admin/cases/' + c.id + '/prizes', { method:'POST', body });
        setStatus(casesStatus, 'Приз добавлен');
      }
      resetForm();
      loadCases();
    }catch(e){ setStatus(casesStatus, e.message, true); }
  });

  // --- prize list ---
  const list = document.createElement('div');
  wrap.appendChild(list);

  function renderList(){
    list.innerHTML = '';
    const prizes = c.prizes || [];
    if (!prizes.length){
      list.innerHTML = '<div class="empty-msg">Призов пока нет</div>';
      return;
    }
    const total = prizes.reduce((s,p)=>s+p.weight,0) || 1;
    // Сортировка от самого ценного (топ редкости) сверху к самому обычному
    // снизу — тот же порядок, что в index.html.
    const orderIndex = (rarityId) => {
      const i = RARITY_ORDER.indexOf(rarityId);
      return i === -1 ? RARITY_ORDER.length : i;
    };
    const sorted = prizes.slice().sort((a,b)=> orderIndex(a.rarity) - orderIndex(b.rarity));
    sorted.forEach(p=>{
      const prRow = document.createElement('div');
      prRow.className = 'prize-row' + (editingPrizeId === p.id ? ' editing' : '');
      prRow.style.setProperty('--row-color', p.color);

      let visual;
      if (p.image){
        visual = document.createElement('img');
        visual.className = 'thumb-row';
        visual.src = window.resolveImageUrl(p.image);
        visual.alt = p.name;
        visual.onerror = function(){
          const dot = document.createElement('div'); dot.className='dot';
          visual.replaceWith(dot);
        };
      } else {
        visual = document.createElement('div'); visual.className='dot';
      }
      const pn = document.createElement('div'); pn.className='pn'; pn.textContent = p.name;
      const prRarity = document.createElement('div'); prRarity.className='pw'; prRarity.style.width='90px'; prRarity.style.color = p.color; prRarity.style.fontWeight='800'; prRarity.textContent = rarityInfo(p.rarity).label;
      const pw = document.createElement('div'); pw.className='pw'; pw.textContent = ((p.weight/total)*100).toFixed(1) + '%';
      const pq = document.createElement('div'); pq.className='pq'; pq.textContent = (p.qty===null||p.qty===undefined) ? '∞' : ('×'+p.qty);

      const btnEdit = document.createElement('button'); btnEdit.type='button'; btnEdit.textContent='✎';
      btnEdit.title = 'Изменить';
      btnEdit.onclick = ()=> enterEdit(p);

      const btnDel = document.createElement('button'); btnDel.type='button'; btnDel.className='rm'; btnDel.textContent='✕';
      btnDel.title = 'Удалить';
      btnDel.onclick = async ()=>{
        if (!confirm('Удалить приз «' + p.name + '»?')) return;
        try{
          await api('/admin/prizes/' + p.id, { method:'DELETE' });
          if (editingPrizeId === p.id) resetForm();
          setStatus(casesStatus, 'Приз удалён');
          loadCases();
        }catch(e){ setStatus(casesStatus, e.message, true); }
      };

      prRow.appendChild(visual); prRow.appendChild(pn); prRow.appendChild(prRarity); prRow.appendChild(pw); prRow.appendChild(pq);
      prRow.appendChild(btnEdit); prRow.appendChild(btnDel);
      list.appendChild(prRow);
    });
  }
  renderList();

  return wrap;
}

document.getElementById('btnNewCase').addEventListener('click', async ()=>{
  const name = prompt('Название нового кейса:', 'НОВЫЙ КЕЙС');
  if (!name || !name.trim()) return;
  const color = prompt('Цвет кейса (hex):', '#e4ae39') || '#e4ae39';
  try{
    const created = await api('/admin/cases', { method:'POST', body:{ name: name.trim(), color, image:'' } });
    setStatus(casesStatus, 'Кейс создан');
    await loadCases();
    openCaseEditor(created.id);
  }catch(e){ setStatus(casesStatus, e.message, true); }
});

document.getElementById('btnImport').addEventListener('click', async ()=>{
  const url = document.getElementById('importUrl').value.trim();
  if (!url) return;
  try{
    const res = await api('/admin/cases/import', { method:'POST', body:{ url } });
    setStatus(casesStatus, 'Импортировано кейсов: ' + res.imported);
    loadCases();
  }catch(e){ setStatus(casesStatus, e.message, true); }
});

/* ================= INIT ================= */

(async function init(){
  const ok = await tryRestoreSession();
  if (ok) await enterApp();
})();
</script>
