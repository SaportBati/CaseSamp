<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кейс</title>
<style>
  :root{
    --accent: #e4ae39;
    --accent-dim: #7a5b1c;
    --bg: #0b0c10;
    --panel: #15171d;
    --panel-2: #1c1f27;
    --line: #2a2d37;
    --text: #eceef2;
    --text-dim: #8b8f9c;
    --danger: #eb4b4b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
    padding:0 16px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  .eyebrow{
    font-size:12px;letter-spacing:.25em;text-transform:uppercase;
    color:var(--accent);font-weight:700;text-align:center;margin-bottom:6px;
  }
  .name-edit{
    display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:36px;
  }
  .name-edit input[type=text]{
    background:transparent;border:none;border-bottom:1px dashed var(--line);
    color:var(--text);font-size:clamp(24px,4.5vw,38px);font-weight:900;text-transform:uppercase;
    letter-spacing:.04em;text-align:center;padding:2px 6px;width:min(90vw,520px);
  }
  .name-edit input[type=text]:focus{outline:none;border-bottom-color:var(--accent);}
  .case-selector{
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
    gap:10px 12px;margin-bottom:12px;padding:0 4px;
  }
  .case-display{
    display:flex;align-items:center;gap:8px;min-width:0;max-width:100%;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:2px;padding:4px 12px;
  }
  .case-display .case-dot{
    width:12px;height:12px;border-radius:50%;background:var(--accent);
    flex:0 0 auto;
  }
  .case-display .case-name{
    font-size:13px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:48vw;
  }
  .case-select-btn{
    background:var(--panel-2);border:1px solid var(--line);
    color:var(--text);padding:5px 12px;border-radius:2px;
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    font-weight:600;cursor:pointer;white-space:nowrap;flex:0 0 auto;
    transition:border-color .15s ease;
  }
  .case-select-btn:hover{border-color:var(--accent);color:var(--accent);}
  .case-select-btn:active{transform:translateY(1px);}
  .nick-edit{
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
    gap:8px;margin:2px 0 32px;padding:0 4px;
    font-size:13px;color:var(--text-dim);
  }
  .nick-edit label{font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:11px;}
  .nick-edit input[type=text]{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-size:14px;font-weight:600;text-align:center;padding:5px 10px;border-radius:2px;
    width:160px;max-width:60vw;box-sizing:border-box;
  }
  .nick-edit input[type=text]:focus{outline:none;border-color:var(--accent);}
  @media (max-width:420px){
    .case-display .case-name{max-width:38vw;}
    .case-display, .case-select-btn{padding:5px 10px;font-size:11px;}
  }
  .stage-area{
    position:relative;
    height:300px;
    margin-bottom:28px;
  }
  .stage-crate{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .5s ease, transform .5s ease;
    opacity:1;transform:scale(1);
  }
  .stage-crate.hide{
    opacity:0;transform:scale(.9);
    pointer-events:none;
  }
  .crate{
    position:relative;
    width:170px;height:170px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .25s ease;
  }
  .crate:hover{transform:translateY(-4px);}
  .crate svg{width:100%;height:100%;filter:drop-shadow(0 0 24px color-mix(in srgb, var(--accent) 55%, transparent));}
  .crate.shaking{animation:shake .55s ease;}
  @keyframes shake{
    0%,100%{transform:translate(0,0) rotate(0);}
    15%{transform:translate(-4px,0) rotate(-1.5deg);}
    30%{transform:translate(4px,0) rotate(1.5deg);}
    45%{transform:translate(-6px,0) rotate(-2deg);}
    60%{transform:translate(6px,0) rotate(2deg);}
    75%{transform:translate(-3px,0) rotate(-1deg);}
    90%{transform:translate(3px,0) rotate(1deg);}
  }
  .flash{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 90%, white) 0%, transparent 70%);
    opacity:0;pointer-events:none;
  }
  .flash.go{animation:flashpop .6s ease forwards;}
  @keyframes flashpop{
    0%{opacity:0;transform:scale(.3);}
    35%{opacity:.9;transform:scale(1.4);}
    100%{opacity:0;transform:scale(2.4);}
  }

  .open-btn{
    display:block;margin:0 auto 40px;
    background:var(--accent);
    color:#161616;
    border:none;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:15px;
    padding:14px 38px;
    border-radius:2px;
    cursor:pointer;
    transition:filter .15s ease, transform .15s ease, opacity .3s ease;
  }
  .open-btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px);}
  .open-btn:disabled{background:var(--panel-2);color:var(--text-dim);cursor:not-allowed;}

  .hint{text-align:center;color:var(--text-dim);font-size:13px;margin:-24px 0 40px;}

  .stage-reel{
    position:absolute;inset:0;
    display:flex;align-items:center;
    transition:opacity .5s ease, transform .5s ease;
    opacity:0;transform:scale(.95);
    pointer-events:none;
  }
  .stage-reel.show{
    opacity:1;transform:scale(1);
    pointer-events:auto;
  }
  .reel-viewport{
    position:relative;
    width:100%;height:100%;
    overflow:hidden;
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow: inset 0 0 60px rgba(0,0,0,.5);
    transition:filter .6s ease;
  }
  .reel-viewport.dimmed{
    filter:blur(7px) brightness(.32) saturate(.7);
  }
  .reel-viewport::before, .reel-viewport::after{
    content:"";position:absolute;top:0;bottom:0;width:90px;z-index:3;pointer-events:none;
  }
  .reel-viewport::before{left:0;background:linear-gradient(90deg, var(--panel) 0%, transparent 100%);}
  .reel-viewport::after{right:0;background:linear-gradient(270deg, var(--panel) 0%, transparent 100%);}
  .marker{
    position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;
    background:var(--accent);z-index:4;
    box-shadow:0 0 10px var(--accent), 0 0 20px var(--accent);
  }
  .marker::before, .marker::after{
    content:"";position:absolute;left:50%;transform:translateX(-50%);
    border-left:8px solid transparent;border-right:8px solid transparent;
  }
  .marker::before{top:-1px;border-top:9px solid var(--accent);}
  .marker::after{bottom:-1px;border-bottom:9px solid var(--accent);}
  .strip{
    position:absolute;top:0;left:0;height:100%;
    display:flex;align-items:center;
    will-change:transform;
  }
  .strip-item{
    width:150px;height:150px;flex:0 0 auto;margin:0 10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-bottom:3px solid var(--item-color, var(--accent));
    border-radius:3px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:10px;
    position:relative;
    overflow:hidden;
  }
  .strip-item::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--item-color, var(--accent)) 30%, transparent), transparent 70%);
  }
  .strip-item .dot{
    width:34px;height:34px;border-radius:50%;
    background:var(--item-color, var(--accent));
    margin-bottom:10px;
    box-shadow:0 0 14px color-mix(in srgb, var(--item-color, var(--accent)) 70%, transparent);
    z-index:1;
  }
  .strip-item .thumb{
    width:76px;height:76px;object-fit:cover;border-radius:6px;
    margin-bottom:10px;z-index:1;
    border:1px solid color-mix(in srgb, var(--item-color, var(--accent)) 65%, transparent);
    box-shadow:0 0 14px color-mix(in srgb, var(--item-color, var(--accent)) 55%, transparent);
  }
  .strip-item .nm{
    font-size:12.5px;font-weight:700;line-height:1.25;
    z-index:1;
    word-break:break-word;
  }

  .reveal-overlay{
    position:absolute;inset:0;z-index:5;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.85);
    pointer-events:none;
    transition:opacity .5s ease, transform .5s ease;
  }
  .reveal-overlay.show{
    opacity:1;transform:scale(1);
    pointer-events:auto;
  }
  .reveal-card{
    display:flex;flex-direction:column;align-items:center;
    padding:22px 34px;
    background:color-mix(in srgb, var(--panel) 92%, transparent);
    backdrop-filter:blur(2px);
    border:1px solid var(--line);
    border-top:3px solid var(--win-color, var(--accent));
    border-radius:4px;
    box-shadow:0 0 50px color-mix(in srgb, var(--win-color, var(--accent)) 45%, transparent);
    max-width:90%;
  }
  .reveal-dot{
    width:52px;height:52px;border-radius:50%;
    background:var(--win-color, var(--accent));
    margin-bottom:12px;
    box-shadow:0 0 26px color-mix(in srgb, var(--win-color, var(--accent)) 80%, transparent);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .reveal-thumb{
    width:92px;height:92px;object-fit:cover;border-radius:8px;
    margin-bottom:12px;
    border:1px solid var(--win-color, var(--accent));
    box-shadow:0 0 30px color-mix(in srgb, var(--win-color, var(--accent)) 60%, transparent);
  }
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .reveal-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;}
  .reveal-rarity{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;}
  .reveal-name{font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;text-align:center;}
  .reveal-actions{display:flex;gap:10px;margin-top:18px;}
  .reveal-btn{
    background:transparent;color:var(--text);
    border:1px solid var(--line);padding:9px 20px;border-radius:2px;
    text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;font-weight:700;
    cursor:pointer;white-space:nowrap;
  }
  .reveal-btn:hover{border-color:var(--accent);color:var(--accent);}
  .reveal-btn.primary{background:var(--accent);color:#161616;border-color:var(--accent);}
  .reveal-btn.primary:hover{filter:brightness(1.1);color:#161616;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 24px;
    margin-bottom:20px;
    transition:border-color .3s ease;
  }
  .panel h2{
    font-size:13px;text-transform:uppercase;letter-spacing:.14em;
    color:var(--text-dim);margin:0 0 16px;font-weight:700;
  }

  .empty-msg{color:var(--text-dim);font-size:13px;text-align:center;padding:24px 0;}

  .page{max-width:920px;margin:0 auto;padding-top:calc(var(--header-h) + 28px);}

  @media (min-width:1300px){
    body{padding-right:400px;}
  }

  :root{ --header-h:64px; }
  .site-header{
    position:fixed;top:0;left:0;right:0;z-index:70;
    height:var(--header-h);
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:0 24px;
    background:color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .site-header .brand{
    display:flex;align-items:center;gap:10px;
    font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text);white-space:nowrap;
  }
  .site-header .brand .brand-mark{
    width:9px;height:9px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px color-mix(in srgb, var(--accent) 70%, transparent);
    flex:0 0 auto;
  }
  .site-header .brand span.brand-dim{color:var(--text-dim);font-weight:600;}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .header-btn{
    display:none;align-items:center;gap:7px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:9px 16px;border-radius:5px;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;cursor:pointer;
    text-decoration:none;white-space:nowrap;
    transition:border-color .2s ease,color .2s ease;
  }
  .header-btn.always{display:flex;}
  .header-btn.show{display:flex;}
  .header-btn .hb-icon{font-size:14px;line-height:1;}
  #btnAdmin.header-btn:hover{border-color:var(--accent);color:var(--accent);}
  #btnLogout.header-btn:hover{border-color:var(--danger);color:var(--danger);}
  @media (max-width:640px){
    .site-header{padding:0 14px;}
    .site-header .brand .brand-text{display:none;}
    .header-btn{padding:9px 11px;}
    .header-btn .hb-label{display:none;}
  }

  body.not-authed .page,
  body.not-authed .site-header,
  body.not-authed .side-feed{
    display:none !important;
  }

  .auth-overlay{
    position:fixed;inset:0;z-index:200;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent),
      var(--bg);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  body:not(.not-authed) .auth-overlay{display:none;}
  .auth-box{
    width:min(360px, 100%);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:28px 26px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .auth-box h1{
    margin:0 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:.14em;
    color:var(--accent);font-weight:800;text-align:center;
  }
  .auth-box p.auth-sub{
    margin:0 0 22px;font-size:12px;color:var(--text-dim);text-align:center;
  }
  .auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .auth-field label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);}
  .auth-field input{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:4px;font-size:14px;width:100%;
  }
  .auth-field input:focus{outline:none;border-color:var(--accent);}
  .auth-error{
    color:var(--danger);font-size:12px;min-height:16px;margin:-4px 0 12px;text-align:center;
  }
  .auth-submit{
    width:100%;background:var(--accent);border:none;color:#141414;
    padding:11px 18px;border-radius:4px;font-weight:800;text-transform:uppercase;
    font-size:13px;letter-spacing:.05em;cursor:pointer;
  }
  .auth-submit:hover{filter:brightness(1.08);}
  .auth-remember{
    display:flex;align-items:center;gap:7px;margin:2px 0 16px;
    font-size:12px;color:var(--text-dim);
  }
  .auth-remember input{width:14px;height:14px;}

  .side-feed{
    position:fixed;top:var(--header-h);right:0;bottom:0;z-index:45;
    width:400px;height:calc(100vh - var(--header-h));
    display:flex;flex-direction:column;
    background:transparent;
    border:none;
    padding:0;
  }
  .feed-title{
    display:flex;align-items:center;gap:9px;flex:0 0 auto;
    padding:18px 20px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .feed-title h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-dim);font-weight:700;}
  .live-dot{
    width:8px;height:8px;border-radius:50%;background:#4be07a;flex:0 0 auto;
    box-shadow:0 0 8px #4be07a;
    animation:liveDotPulse 1.6s ease-in-out infinite;
  }
  @keyframes liveDotPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(.75);}}
  .feed-actions{display:flex;align-items:center;gap:6px;}
  .feed-icon-btn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);
    width:28px;height:28px;border-radius:5px;font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;padding:0;
  }
  .feed-icon-btn:hover{border-color:var(--accent);color:var(--accent);}
  .feed-status{font-size:10.5px;color:var(--accent);letter-spacing:.02em;margin:0 0 10px;min-height:13px;text-align:center;}
  .feed-status:empty{margin:0;}


  .feed-track-wrap{
    position:relative;flex:1 1 auto;min-height:0;
    border:none;border-radius:0;
    overflow:hidden;
    background:transparent;
  }
  .feed-track{display:flex;flex-direction:column;}

  .feed-track.marquee{
    animation: feedMarquee var(--marquee-duration, 30s) linear infinite;
  }
  .feed-track-wrap:hover .feed-track.marquee{animation-play-state:paused;}
  @keyframes feedMarquee{
    from{ transform: translateY(-50%); }
    to{ transform: translateY(0%); }
  }

  .feed-item{
    position:relative;
    display:flex;flex-direction:column;align-items:center;
    gap:6px;text-align:center;
    padding:16px 14px 14px;
    border-bottom:1px solid var(--line);
    border-left:4px solid var(--item-color, var(--accent));
    background:
      radial-gradient(140% 120% at 50% 0%, color-mix(in srgb, var(--item-color, var(--accent)) 16%, transparent), transparent 65%),
      var(--panel-2);
    transition:background .15s ease;
    animation:feedItemIn .35s ease;
    cursor:default;
  }
  .feed-item:last-child{border-bottom:none;}
  .feed-item:hover{background:color-mix(in srgb, var(--item-color, var(--accent)) 10%, var(--panel-2));}
  @keyframes feedItemIn{
    from{opacity:0;transform:translateY(-8px);}
    to{opacity:1;transform:translateY(0);}
  }
  .feed-item .dot{width:48px;height:48px;border-radius:50%;background:var(--item-color, var(--accent));flex:0 0 auto;box-shadow:0 0 16px color-mix(in srgb, var(--item-color, var(--accent)) 60%, transparent);}
  .feed-item .thumb{width:68px;height:68px;object-fit:cover;border-radius:8px;flex:0 0 auto;border:1px solid var(--item-color, var(--accent));box-shadow:0 0 16px color-mix(in srgb, var(--item-color, var(--accent)) 45%, transparent);}
  .feed-item .fi-info{display:flex;flex-direction:column;gap:3px;line-height:1.3;min-width:0;max-width:100%;}
  .feed-item .fi-name{font-size:13.5px;font-weight:800;white-space:normal;word-break:break-word;}
  .feed-item .fi-meta{font-size:11px;color:var(--text-dim);white-space:normal;word-break:break-word;}
  .feed-item .fi-player{font-size:12px;font-weight:700;color:var(--accent);white-space:normal;word-break:break-word;}
  .feed-item .fi-date{font-size:10.5px;color:var(--text-dim);white-space:normal;word-break:break-word;}
  .feed-empty{padding:30px 8px;color:var(--text-dim);font-size:12.5px;text-align:center;}
  .qty-badge{
    display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;
    color:var(--accent);border:1px solid var(--accent-dim);border-radius:10px;
    padding:1px 7px;vertical-align:middle;
  }

  @media (max-width:1300px){
    .side-feed{
      position:static;width:100%;max-height:none;
      margin-top:28px;top:auto;right:auto;
    }
    .feed-track-wrap{max-height:460px;overflow:hidden;}
  }
  @media (max-width:560px){
    :root{ --header-h:56px; }
  }

  .crate-visual{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .crate-visual img{
    width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 0 24px color-mix(in srgb, var(--accent) 55%, transparent));
  }

  .showcase-panel{margin:0 0 40px;}
  .showcase-title{
    font-size:12px;text-transform:uppercase;letter-spacing:.14em;
    color:var(--text-dim);text-align:center;margin:0 0 16px;font-weight:700;
  }
  .prize-showcase{
    display:grid;grid-template-columns:repeat(5, 1fr);gap:14px;
    max-height:min(64vh, 560px);overflow-y:auto;overflow-x:hidden;
    padding:4px 4px 4px 0;
  }
  .prize-showcase::-webkit-scrollbar{width:8px;}
  .prize-showcase::-webkit-scrollbar-track{background:transparent;}
  .prize-showcase::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .prize-showcase::-webkit-scrollbar-thumb:hover{background:var(--accent-dim);}

  .showcase-body{display:flex;align-items:stretch;gap:16px;}
  .showcase-body .prize-showcase{flex:1 1 auto;min-width:0;}
  .volume-control{
    flex:0 0 auto;width:58px;

window.CASE_IMAGES = [

window.CASES_API_URL = "https://curly-tooth-4ec5.aaf60251.workers.dev/api/cases";
window.resolveImageUrl = function(src){
  if (!src) return '';
  let url = src.trim();
  const blobMatch = url.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^?]+)/i);
  if (blobMatch){
    url = `https://raw.githubusercontent.com/${blobMatch[1]}/${blobMatch[2]}/${blobMatch[3]}`;
  }
  return /^https?:\/\//i.test(url) ? url : (window.IMAGES_BASE_URL + url);
};
window.RARITY_LABELS = {
  secret: 'Секретный',
  legendary: 'Легендарный',
  unique: 'Уникальный',
  rare: 'Редкий',
  common: 'Обычный',
  // старые/альтернативные id на всякий случай, чтобы не потерять подписи
  arcane: 'Секретный',
  epic: 'Уникальный'
};
window.rarityLabel = function(id){
  return window.RARITY_LABELS[id] || window.RARITY_LABELS.common;
};
// Ранг ценности редкости: чем меньше число — тем ценнее приз (0 — самый ценный).
// Именно по этой шкале призы в кейсе выстраиваются слева направо.
window.RARITY_RANK = {
  secret: 0,
  arcane: 0,      // алиас старого id -> топ-редкость
  legendary: 1,
  unique: 2,
  epic: 2,        // алиас старого id -> уровень "уникальный"
  rare: 3,
  common: 4
};
window.rarityRank = function(id){
  if (id in window.RARITY_RANK) return window.RARITY_RANK[id];
  return 99; // неизвестная редкость — в конец, дальше сортируется по весу
};

<script>
(function(){
  const API_BASE_URL = 'https://curly-tooth-4ec5.aaf60251.workers.dev/api';

  let authToken = null;
  let currentUser = null;

  function saveAuth(token, user) {
    authToken = token;
    currentUser = user;
    try {
      localStorage.setItem('case_opener_token', token);
      localStorage.setItem('case_opener_user', JSON.stringify(user));
    } catch (e) {}
  }

  function loadAuth() {
    try {
      const token = localStorage.getItem('case_opener_token');
      const userStr = localStorage.getItem('case_opener_user');
      if (token && userStr) {
        authToken = token;
        currentUser = JSON.parse(userStr);
        return true;
      }
    } catch (e) {}
    return false;
  }

  function clearAuth() {
    authToken = null;
    currentUser = null;
    try {
      localStorage.removeItem('case_opener_token');
      localStorage.removeItem('case_opener_user');
    } catch (e) {}
  }

  function getAuthHeaders() {
    const headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    return headers;
  }

  const API = {
    register: async function (login, password) {
      const res = await fetch(`${API_BASE_URL}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password }),
      });
      const data = await res.json();
      if (!res.ok) return { error: data.error || 'Registration failed' };
      return data;
    },

    login: async function (login, password) {
      try {
        const res = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password }),
        });
        const data = await res.json();
        if (res.ok) {
          saveAuth(data.token, data.user);
          return data;
        }
        return { error: data.error || 'Invalid credentials' };
      } catch (e) {
        return { error: 'Network error: could not reach auth server' };
      }
    },

    logout: function () { clearAuth(); },
    profile: async function () {
      const res = await fetch(`${API_BASE_URL}/auth/profile`, { headers: getAuthHeaders() });
      return await res.json();
    },
    isLoggedIn: function () { return !!authToken; },
    getCurrentUser: function () { return currentUser; },

    addFeedEntry: async function (entry) {
      try {
        const res = await fetch(`${API_BASE_URL}/feed`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry),
        });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    },
    getFeed: async function (sinceId) {
      try {
        const qs = sinceId ? `?since=${encodeURIComponent(sinceId)}` : '?limit=60';
        const res = await fetch(`${API_BASE_URL}/feed${qs}`);
        if (!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data) ? data : [];
      } catch (e) {
        return [];
      }
    },
  };

  loadAuth();
  window.API = API;
})();
</script>

<script>

(function(){
  const CASES_DB_KEY = 'case_opener_cases_db';
  const FEED_DB_KEY = 'case_opener_feed_db';

  function loadCases(){
    try {
      const saved = localStorage.getItem(CASES_DB_KEY);
      if (saved){
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)){
          window.CASES_DB = parsed;
          return;
        }
      }
    } catch(e){}
    window.CASES_DB = [];
  }

  function saveCases(){
    try { localStorage.setItem(CASES_DB_KEY, JSON.stringify(window.CASES_DB)); } catch(e){}
  }

  function loadFeed(){
    try {
      const saved = localStorage.getItem(FEED_DB_KEY);
      if (saved){ window.FEED_DB = JSON.parse(saved); return; }
    } catch(e){}
    window.FEED_DB = [];
  }

  function saveFeed(){
    try { localStorage.setItem(FEED_DB_KEY, JSON.stringify(window.FEED_DB)); } catch(e){}
  }

  loadCases();
  loadFeed();

  (async function syncPresetCasesFromServer(){
    if (!window.CASES_API_URL) return;
    try {
      const res = await fetch(window.CASES_API_URL);
      if (!res.ok) return;
      const list = await res.json();
      if (!Array.isArray(list) || !list.length) return;

      const cases = window.CASES_DB || [];
      let changed = false;

      list.forEach((c) => {
        const presetKey = 'server:' + c.id;
        const prizes = (Array.isArray(c.prizes) ? c.prizes : []).map((p, j) => ({
          id: j + 1,
          name: p.name,
          rarity: p.rarity || 'common',
          color: p.color || '#4b69ff',
          image: p.image || null,
          weight: p.weight || 10,
          qty: (p.qty === undefined) ? null : p.qty
        }));
        const existing = cases.find(x => x.presetKey === presetKey);
        if (existing) {
          existing.name = c.name || existing.name;
          existing.color = c.color || existing.color;
          existing.image = c.image || existing.image;
          existing.prizes = prizes;
        } else {
          const newId = Math.max(0, ...cases.map(x => x.id)) + 1;
          cases.push({
            id: newId,
            presetKey: presetKey,
            name: c.name || 'КЕЙС',
            color: c.color || '#e4ae39',
            image: c.image || '',
            prizes: prizes
          });
        }
        changed = true;
      });

      const onlyPresets = cases.filter(c => !!c.presetKey);

      if (changed || onlyPresets.length !== cases.length) {
        window.CASES_DB = onlyPresets;
        saveCases();
        window.dispatchEvent(new Event('cases-db-ready'));
      }
    } catch(e) {
    }
  })();

  window.CaseDB = {
    getCases: function(){ return window.CASES_DB || []; },
    getCaseById: function(id){
      const cases = window.CASES_DB || [];
      return cases.find(c => c.id === id) || null;
    },
    addCase: function(name, color, prizes, image){
      const cases = window.CASES_DB || [];
      const newId = Math.max(0, ...cases.map(c => c.id)) + 1;
      const newCase = { id: newId, name: name, color: color || '#e4ae39', image: image || '', prizes: prizes || [] };
      cases.push(newCase);
      window.CASES_DB = cases;
      saveCases();
      return newCase;
    },
    updateCase: function(id, updates){
      const cases = window.CASES_DB || [];
      const idx = cases.findIndex(c => c.id === id);
      if (idx === -1) return null;
      cases[idx] = { ...cases[idx], ...updates };
      window.CASES_DB = cases;
      saveCases();
      return cases[idx];
    },
    deleteCase: function(id){
      const cases = window.CASES_DB || [];
      window.CASES_DB = cases.filter(c => c.id !== id);
      saveCases();
    },
    addPrizeToCase: function(caseId, prize){
      const cases = window.CASES_DB || [];
      const caseIdx = cases.findIndex(c => c.id === caseId);
      if (caseIdx === -1) return null;
      const prizes = cases[caseIdx].prizes || [];
      const newId = Math.max(0, ...prizes.map(p => p.id)) + 1;
      const newPrize = {
        id: newId,
        name: prize.name,
        color: prize.color || '#4b69ff',
        image: prize.image || '',
        weight: prize.weight || 10,
        qty: prize.qty !== undefined && prize.qty !== null ? prize.qty : null
      };
      prizes.push(newPrize);
      cases[caseIdx].prizes = prizes;
      window.CASES_DB = cases;
      saveCases();
      return newPrize;
    },
    updatePrizeInCase: function(caseId, prizeId, updates){
      const cases = window.CASES_DB || [];
      const caseIdx = cases.findIndex(c => c.id === caseId);
      if (caseIdx === -1) return null;
      const prizes = cases[caseIdx].prizes || [];
      const prizeIdx = prizes.findIndex(p => p.id === prizeId);
      if (prizeIdx === -1) return null;
      prizes[prizeIdx] = { ...prizes[prizeIdx], ...updates };
      cases[caseIdx].prizes = prizes;
      window.CASES_DB = cases;
      saveCases();
      return prizes[prizeIdx];
    },
    removePrizeFromCase: function(caseId, prizeId){
      const cases = window.CASES_DB || [];
      const caseIdx = cases.findIndex(c => c.id === caseId);
      if (caseIdx === -1) return;
      const prizes = cases[caseIdx].prizes || [];
      cases[caseIdx].prizes = prizes.filter(p => p.id !== prizeId);
      window.CASES_DB = cases;
      saveCases();
    },
    getCasePrizes: function(caseId){
      const cases = window.CASES_DB || [];
      const caseObj = cases.find(c => c.id === caseId);
      return caseObj ? (caseObj.prizes || []) : [];
    }
  };

  window.FeedDB = {
    getEntries: function(){ return window.FEED_DB || []; },
    addEntry: function(entry){
      const feed = window.FEED_DB || [];
      const newId = Math.max(0, ...feed.map(e => e.id)) + 1;
      const newEntry = {
        id: newId,
        ts: entry.ts || new Date().toISOString(),
        nickname: entry.nickname || 'Игрок',
        caseName: entry.caseName || '',
        name: entry.name,
        color: entry.color || '#4b69ff',
        image: entry.image || '',
        qty: entry.qty !== undefined && entry.qty !== null ? entry.qty : null
      };
      feed.push(newEntry);
      window.FEED_DB = feed;
      saveFeed();
      return newEntry;
    },
    clear: function(){ window.FEED_DB = []; saveFeed(); },
    export: function(){ return window.FEED_DB || []; },
    import: function(entries){
      if (!Array.isArray(entries)) return;
      window.FEED_DB = entries;
      saveFeed();
    }
  };

  window.exportFeedData = function(){ return window.FeedDB.export(); };
  window.importFeedData = function(data){ window.FeedDB.import(data); };
  window.exportCasesData = function(){ return window.CASES_DB; };
  window.importCasesData = function(data){
    if (Array.isArray(data)){ window.CASES_DB = data; saveCases(); }
  };
})();
</script>

<script>
(function(){
  const body = document.body;
  const authOverlay = document.getElementById('authOverlay');
  const authForm = document.getElementById('authForm');
  const authLogin = document.getElementById('authLogin');
  const authPassword = document.getElementById('authPassword');
  const authRemember = document.getElementById('authRemember');
  const authError = document.getElementById('authError');
  const btnLogout = document.getElementById('btnLogout');
  const btnAdmin = document.getElementById('btnAdmin');
  const authSubmitBtn = authForm.querySelector('button[type="submit"], input[type="submit"]');


  function updateAdminLink(){
    const user = window.API ? window.API.getCurrentUser() : null;
    if (btnAdmin) btnAdmin.classList.toggle('show', !!(user && user.isAdmin));
  }

  if (window.API && window.API.isLoggedIn()){
    body.classList.remove('not-authed');
  }
  updateAdminLink();

  authForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const login = authLogin.value.trim();
    const password = authPassword.value;
    authError.textContent = '';

    if (authSubmitBtn) authSubmitBtn.disabled = true;
    const result = await window.API.login(login, password);
    if (authSubmitBtn) authSubmitBtn.disabled = false;

    if (result && result.token){
      body.classList.remove('not-authed');
      updateAdminLink();
    } else {
      authError.textContent = (result && result.error) ? result.error : 'Неверный логин или пароль';
      authPassword.value = '';
      authPassword.focus();
    }
  });

  btnLogout.addEventListener('click', function(){
    window.API.logout();
    body.classList.add('not-authed');
    body.classList.add('browsing-gallery');
    authLogin.value = '';
    authPassword.value = '';
    authError.textContent = '';
    authLogin.focus();
    updateAdminLink();
  });
})();

(function(){
  const root = document.documentElement;
  const openSound = document.getElementById('openSound');
  const tickSound = document.getElementById('tickSound');
  const finishSound = document.getElementById('finishSound');

  const btnSelectCase = document.getElementById('btnSelectCase');
  const caseDot = document.getElementById('caseDot');
  const caseNameDisplay = document.getElementById('caseNameDisplay');

  const galleryGrid = document.getElementById('galleryGrid');

  function galleryVisualEl(c){
    if (c.image){
      const img = document.createElement('img');
      img.src = window.resolveImageUrl(c.image);
      img.alt = c.name;
      img.onerror = function(){
        console.warn('[кейсы] не удалось загрузить картинку кейса "' + c.name + '":', img.src);
        const fb = document.createElement('div');
        fb.className = 'gallery-card-fallback';
        fb.textContent = '📦';
        img.replaceWith(fb);
      };
      return img;
    }
    const fb = document.createElement('div');
    fb.className = 'gallery-card-fallback';
    fb.textContent = '📦';
    return fb;
  }

  function renderGallery(){
    if (!galleryGrid) return;
    const cases = window.CaseDB.getCases();
    galleryGrid.innerHTML = '';
    if (cases.length === 0){
      galleryGrid.innerHTML = '<p style="color:var(--text-dim);text-align:center;grid-column:1/-1;">Кейсы не найдены</p>';
      return;
    }
    cases.forEach(c=>{
      const card = document.createElement('div');
      card.className = 'gallery-card';
      card.style.setProperty('--item-color', c.color || '#e4ae39');

      const imgWrap = document.createElement('div');
      imgWrap.className = 'gallery-card-image';
      imgWrap.appendChild(galleryVisualEl(c));

      const name = document.createElement('div');
      name.className = 'gallery-card-name';
      name.textContent = c.name;

      card.appendChild(imgWrap);
      card.appendChild(name);
      card.addEventListener('click', ()=> chooseCaseFromGallery(c.id));
      galleryGrid.appendChild(card);
    });
  }

  function chooseCaseFromGallery(id){
    currentCaseId = id;
    loadCurrentCase();
    document.body.classList.remove('browsing-gallery');
  }

  function showGallery(){
    document.body.classList.add('browsing-gallery');
    renderGallery();
  }

  window.addEventListener('cases-db-ready', function(){
    renderGallery();
    if (!currentCase){
      loadCurrentCase();
    }
  });

  btnSelectCase.addEventListener('click', showGallery);

  const CRATE_ANIM_MS = 950;
  const SPIN_DURATION = 7.05;

  function playOpenSound(){
    try{
      openSound.currentTime = 0;
      openSound.play().catch(()=>{});
    }catch(e){}
  }
  function playTickSound(){
    try{

      const t = tickSound.cloneNode(true);
      t.volume = tickSound.volume;
      t.play().catch(()=>{});
    }catch(e){}
  }
  function playFinishSound(){
    try{
      finishSound.currentTime = 0;
      finishSound.play().catch(()=>{});
    }catch(e){}
  }
  function stopAllSounds(){
    [openSound, finishSound].forEach(a=>{
      try{ a.pause(); a.currentTime = 0; }catch(e){}
    });
  }

  const VOLUME_STORAGE_KEY = 'case_opener_volume';
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIconBtn = document.getElementById('volumeIconBtn');
  const volumeIcon = document.getElementById('volumeIcon');
  const volumeValue = document.getElementById('volumeValue');
  let lastNonZeroVolume = 60;

  function volumeIconFor(pct){
    if (pct <= 0) return '🔇';
    if (pct < 50) return '🔉';
    return '🔊';
  }

  function applyVolume(pct){
    const clamped = Math.max(0, Math.min(100, pct));
    const v = clamped / 100;
    [openSound, tickSound, finishSound].forEach(a=>{ if (a) a.volume = v; });
    if (volumeValue) volumeValue.textContent = Math.round(clamped) + '%';
    if (volumeIcon) volumeIcon.textContent = volumeIconFor(clamped);
    if (volumeSlider && Number(volumeSlider.value) !== clamped) volumeSlider.value = clamped;
    if (clamped > 0) lastNonZeroVolume = clamped;
  }

  function saveVolume(pct){
    try{ localStorage.setItem(VOLUME_STORAGE_KEY, String(pct)); }catch(e){}
  }

  function loadVolume(){
    try{
      const saved = localStorage.getItem(VOLUME_STORAGE_KEY);
      if (saved !== null){
        const n = parseInt(saved, 10);
        if (!isNaN(n)) return Math.max(0, Math.min(100, n));
      }
    }catch(e){}
    return 60; // громкость по умолчанию для новых посетителей
  }

  (function initVolume(){
    const initial = loadVolume();
    if (initial > 0) lastNonZeroVolume = initial;
    applyVolume(initial);
  })();

  if (volumeSlider){
    volumeSlider.addEventListener('input', ()=>{
      const pct = Number(volumeSlider.value);
      applyVolume(pct);
      saveVolume(pct);
    });
  }

  if (volumeIconBtn){
    volumeIconBtn.addEventListener('click', ()=>{
      const current = volumeSlider ? Number(volumeSlider.value) : 0;
      const next = current > 0 ? 0 : (lastNonZeroVolume || 60);
      applyVolume(next);
      saveVolume(next);
    });
  }

  const stageCrate = document.getElementById('stageCrate');
  const stageReel = document.getElementById('stageReel');
  const crate = document.getElementById('crate');
  const crateVisual = document.getElementById('crateVisual');
  const defaultCrateMarkup = crateVisual ? crateVisual.innerHTML : '';
  const prizeShowcase = document.getElementById('prizeShowcase');
  const flash = document.getElementById('flash');
  const openBtn = document.getElementById('openBtn');
  const hint = document.getElementById('hint');
  const reelViewport = document.getElementById('reelViewport');
  const strip = document.getElementById('strip');
  const revealOverlay = document.getElementById('revealOverlay');
  const revealName = document.getElementById('revealName');
  const revealCard = document.getElementById('revealCard');
  const btnAgain = document.getElementById('btnAgain');
  const btnClose = document.getElementById('btnClose');

  const nickInput = document.getElementById('nickName');
  const feedTrack = document.getElementById('feedTrack');
  const feedTrackWrap = document.getElementById('feedTrackWrap');

  let currentCaseId = 1;
  let currentCase = null;
  let prizes = [];
  let spinning = false;

  function loadCurrentCase(){
    const cases = window.CaseDB.getCases();
    if (cases.length === 0){
      currentCase = null;
      prizes = [];
      caseNameDisplay.textContent = 'Загрузка...';
      return;
    }
    currentCase = window.CaseDB.getCaseById(currentCaseId);
    if (!currentCase){
      currentCase = cases[0];
      currentCaseId = currentCase.id;
    }
    prizes = currentCase.prizes || [];
    updateCaseNameDisplay();
    updateThemeFromCase();
    applyCaseHeroImage();
    updateOpenState();
    renderPrizeShowcase();
    caseNameDisplay.textContent = currentCase.name;
    caseDot.style.backgroundColor = currentCase.color;
  }

  function applyCaseHeroImage(){
    if (!crateVisual) return;
    if (currentCase && currentCase.image){
      crateVisual.innerHTML = '';
      const img = document.createElement('img');
      img.src = window.resolveImageUrl(currentCase.image);
      img.alt = currentCase.name;
      img.onerror = function(){
        console.warn('[кейсы] не удалось загрузить картинку кейса "' + currentCase.name + '":', img.src);
        crateVisual.innerHTML = defaultCrateMarkup;
      };
      crateVisual.appendChild(img);
    } else {
      crateVisual.innerHTML = defaultCrateMarkup;
    }
  }

  function sortByRarity(list){
    return list.slice().sort((a,b)=>{
      const ra = window.rarityRank(a.rarity);
      const rb = window.rarityRank(b.rarity);
      if (ra !== rb) return ra - rb; // сначала по ценности редкости: секретный -> ... -> обычный
      return a.weight - b.weight;    // внутри одной редкости - по возрастанию шанса (реже выпадает - левее)
    });
  }

  function renderPrizeShowcase(){
    if (!prizeShowcase) return;
    prizeShowcase.innerHTML = '';
    if (!prizes.length) return;
    const totalWeight = prizes.reduce((s,p)=>s+p.weight,0) || 1;
    sortByRarity(prizes).forEach(p=>{
      const item = document.createElement('div');
      item.className = 'showcase-item';
      item.style.setProperty('--item-color', p.color);

      const visualWrap = document.createElement('div');
      visualWrap.className = 'showcase-visual';
      visualWrap.appendChild(visualEl(p, 'strip'));

      const info = document.createElement('div');
      info.className = 'showcase-info';
      const stRarity = document.createElement('div');
      stRarity.className = 'showcase-rarity';
      stRarity.style.color = p.color;
      stRarity.textContent = window.rarityLabel(p.rarity);
      const stName = document.createElement('div');
      stName.className = 'showcase-name';
      stName.textContent = p.name;
      const stChance = document.createElement('div');
      stChance.className = 'showcase-chance';
      stChance.textContent = ((p.weight/totalWeight)*100).toFixed(1) + '%';
      info.appendChild(stRarity);
      info.appendChild(stName);
      info.appendChild(stChance);

      item.appendChild(visualWrap);
      item.appendChild(info);
      prizeShowcase.appendChild(item);
    });
  }

  function updateCaseNameDisplay(){
    if (currentCase){
      applyTheme(currentCase.color);
    }
  }

  function applyTheme(color){
    const safeColor = color || '#e4ae39';
    root.style.setProperty('--accent', safeColor);
    root.style.setProperty('--accent-dim', safeColor);
  }

  function getCaseColor(){
    return currentCase ? currentCase.color : '#e4ae39';
  }

  function updateThemeFromCase(){
    applyTheme(getCaseColor());
  }

  function updateOpenState(){
    const ok = prizes.length >= 2;
    openBtn.disabled = !ok || spinning;
    hint.style.display = ok ? 'none' : 'block';
  }

  function visualEl(p, kind){
    const dotClass = kind === 'row' ? 'dot' : (kind === 'feed' ? 'dot' : (kind === 'strip' ? 'dot' : 'reveal-dot'));
    const imgClass = kind === 'row' ? 'thumb-row' : (kind === 'feed' ? 'thumb' : (kind === 'strip' ? 'thumb' : 'reveal-thumb'));
    if(p.image){
      const img = document.createElement('img');
      img.src = window.resolveImageUrl(p.image);
      img.alt = p.name;
      img.className = imgClass;
      img.title = p.image;
      img.onerror = function(){
        const dot = document.createElement('div');
        dot.className = dotClass;
        dot.title = 'Картинка не найдена: ' + p.image;
        img.replaceWith(dot);
      };
      return img;
    }
    const dot = document.createElement('div');
    dot.className = dotClass;
    return dot;
  }

  function weightedPick(){
    const total = prizes.reduce((s,p)=>s+p.weight,0);
    let r = Math.random()*total;
    for(const p of prizes){
      if(r < p.weight) return p;
      r -= p.weight;
    }
    return prizes[prizes.length-1];
  }

  function buildStrip(winner){
    strip.innerHTML = '';
    const N = 60;
    const targetIndex = 48;
    const items = [];
    for(let i=0;i<N;i++){
      items.push(i === targetIndex ? winner : weightedPick());
    }
    items.forEach(p=>{
      const el = document.createElement('div');
      el.className = 'strip-item';
      el.style.setProperty('--item-color', p.color);
      const visual = visualEl(p, 'strip');
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = p.name;
      el.appendChild(visual);
      el.appendChild(nm);
      strip.appendChild(el);
    });
    return targetIndex;
  }

  const FEED_MAX_SHOWN = 80;
  const FEED_POLL_MS = 4000;
  const FEED_SCROLL_PX_PER_SEC = 36;

  let feedEntries = [];
  let feedKnownIds = new Set();
  let feedLastServerId = 0;
  let feedPollTimer = null;

  function pad2(n){ return String(n).padStart(2,'0'); }
  function nowStamp(){
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  }
  function splitFeedStamp(ts){
    if(!ts) return {date:'', time:''};
    const [datePart, timePart] = ts.split(' ');
    const bits = (datePart || '').split('-');
    const date = bits.length === 3 ? `${bits[2]}.${bits[1]}` : (datePart || '');
    const time = (timePart || '').slice(0, 5);
    return {date, time};
  }

  function formatExactStamp(ts){
    if(!ts) return '';
    const [datePart, timePart] = ts.split(' ');
    const bits = (datePart || '').split('-');
    const date = bits.length === 3 ? `${bits[2]}.${bits[1]}.${bits[0]}` : (datePart || '');
    return time_ok(date, timePart);
    function time_ok(d, t){ return t ? `${d}, ${t}` : d; }
  }

  function feedItemNode(e){
    const el = document.createElement('div');
    el.className = 'feed-item';
    el.style.setProperty('--item-color', e.color || '');
    const visual = visualEl({name: e.name, image: e.image, color: e.color}, 'feed');
    const info = document.createElement('div');
    info.className = 'fi-info';
    const nm = document.createElement('div');
    nm.className = 'fi-name';
    nm.textContent = e.name;
    if(e.qty !== null && e.qty !== undefined){
      const badge = document.createElement('span');
      badge.className = 'qty-badge';
      badge.textContent = '×' + e.qty;
      nm.appendChild(badge);
    }
    info.appendChild(nm);
    if(e.caseName){
      const meta = document.createElement('div');
      meta.className = 'fi-meta';
      meta.textContent = e.caseName;
      info.appendChild(meta);
    }

    const player = document.createElement('div');
    player.className = 'fi-player';
    player.textContent = e.nickname || 'Игрок';
    info.appendChild(player);

    const date = document.createElement('div');
    date.className = 'fi-date';
    date.textContent = formatExactStamp(e.ts) || '—';
    info.appendChild(date);

    el.appendChild(visual);
    el.appendChild(info);
    return el;
  }

  function renderFeedTrack(){
    feedTrack.classList.remove('marquee');
    feedTrack.style.removeProperty('--marquee-duration');
    feedTrack.innerHTML = '';

    if(feedEntries.length === 0){
      const empty = document.createElement('div');
      empty.className = 'feed-empty';
      empty.textContent = 'Пока пусто — откройте кейс первым';
      feedTrack.appendChild(empty);
      return;
    }

    const list = feedEntries.slice(-FEED_MAX_SHOWN).slice().reverse();
    list.forEach(e => feedTrack.appendChild(feedItemNode(e)));

    requestAnimationFrame(()=>{
      const contentHeight = feedTrack.scrollHeight;
      const viewportHeight = feedTrackWrap.clientHeight;
      if(contentHeight > viewportHeight){
        list.forEach(e => feedTrack.appendChild(feedItemNode(e)));
        const duration = Math.max(10, contentHeight / FEED_SCROLL_PX_PER_SEC);
        feedTrack.style.setProperty('--marquee-duration', duration.toFixed(1) + 's');
        feedTrack.classList.add('marquee');
      }
    });
  }

  function mergeFeedEntries(list){
    if(!Array.isArray(list) || !list.length) return false;
    let added = false;
    list.forEach(e=>{
      if(e.id !== undefined && e.id !== null){
        if(feedKnownIds.has(e.id)) return;
        feedKnownIds.add(e.id);
        if(typeof e.id === 'number') feedLastServerId = Math.max(feedLastServerId, e.id);
      }
      feedEntries.push(e);
      added = true;
    });
    if(feedEntries.length > FEED_MAX_SHOWN * 2){
      feedEntries = feedEntries.slice(-FEED_MAX_SHOWN);
    }
    return added;
  }

  async function initFeed(){
    const list = await API.getFeed();
    if(mergeFeedEntries(list)) renderFeedTrack(); else renderFeedTrack();
    if(feedPollTimer) clearInterval(feedPollTimer);
    feedPollTimer = setInterval(async ()=>{
      const fresh = await API.getFeed(feedLastServerId);
      if(mergeFeedEntries(fresh)) renderFeedTrack();
    }, FEED_POLL_MS);
  }

  async function addToFeed(winner){
    const payload = {
      nickname: (nickInput.value || '').trim() || 'Игрок',
      caseName: currentCase ? currentCase.name : '',
      name: winner.name,
      color: winner.color,
      image: winner.image || '',
      qty: (winner.qty === null || winner.qty === undefined) ? null : winner.qty
    };

    const localEntry = { ...payload, id: null, ts: nowStamp() };
    feedEntries.push(localEntry);
    renderFeedTrack();

    const saved = await API.addFeedEntry(payload);
    if(saved && saved.id !== undefined && saved.id !== null){
      const idx = feedEntries.indexOf(localEntry);
      if(idx !== -1) feedEntries.splice(idx, 1);
      mergeFeedEntries([saved]);
      renderFeedTrack();
    }

  }

  initFeed();

  function easeOutSlot(t){
    return 1 - Math.pow(1 - t, 2.2);
  }

  function spinReel(durationSec){
    spinning = true;
    const winner = weightedPick();
    const targetIndex = buildStrip(winner);

    strip.style.transition = 'none';
    strip.style.transform = 'translateX(0px)';
    void strip.offsetWidth;

    const itemFullWidth = 170;
    const viewportCenter = reelViewport.clientWidth / 2;
    const jitter = (Math.random()*70 - 35);
    const targetX = -(targetIndex*itemFullWidth + itemFullWidth/2 - viewportCenter) + jitter;

    const durationMs = durationSec * 1000;
    const startTime = performance.now();

    let lastTickIndex = Math.floor((viewportCenter - 0) / itemFullWidth);

    function frame(now){
      const t = Math.min((now - startTime) / durationMs, 1);
      const currentX = targetX * easeOutSlot(t);
      strip.style.transform = `translateX(${currentX}px)`;

      const passedIndex = Math.floor((viewportCenter - currentX) / itemFullWidth);
      if(passedIndex > lastTickIndex){
        lastTickIndex = passedIndex;
        playTickSound();
      }

      if(t < 1){
        requestAnimationFrame(frame);
      } else {
        showResult(winner);
      }
    }
    requestAnimationFrame(frame);
  }

  function showResult(winner){
    revealCard.style.setProperty('--win-color', winner.color);
    const oldVisual = document.getElementById('revealVisual');
    if(oldVisual) oldVisual.remove();
    const visual = visualEl(winner, 'reveal');
    visual.id = 'revealVisual';
    revealCard.insertBefore(visual, revealCard.firstChild);
    revealName.textContent = winner.name;
    const oldRarity = document.getElementById('revealRarity');
    if(oldRarity) oldRarity.remove();
    const rarityEl = document.createElement('div');
    rarityEl.id = 'revealRarity';
    rarityEl.className = 'reveal-rarity';
    rarityEl.style.color = winner.color;
    rarityEl.textContent = window.rarityLabel(winner.rarity);
    revealName.insertAdjacentElement('beforebegin', rarityEl);
    if(winner.qty !== null && winner.qty !== undefined){
      const badge = document.createElement('span');
      badge.className = 'qty-badge';
      badge.textContent = '×' + winner.qty;
      revealName.appendChild(badge);
    }

    revealOverlay.classList.add('show');
    playFinishSound();
    addToFeed(winner);
    spinning = false;
  }

  openBtn.addEventListener('click', ()=>{
    if(spinning || prizes.length < 2) return;
    spinning = true;
    openBtn.disabled = true;

    crate.classList.add('shaking');
    flash.classList.add('go');
    playOpenSound();

    setTimeout(()=>{
      crate.classList.remove('shaking');
      flash.classList.remove('go');

      stageCrate.classList.add('hide');
      stageReel.classList.add('show');
      openBtn.style.display = 'none';
      hint.style.display = 'none';

      spinReel(SPIN_DURATION);
    }, CRATE_ANIM_MS);
  });

  btnAgain.addEventListener('click', ()=>{
    if(spinning) return;
    revealOverlay.classList.remove('show');
    setTimeout(()=>{
      spinReel(SPIN_DURATION);
    }, 380);
  });

  btnClose.addEventListener('click', ()=>{
    stopAllSounds();
    revealOverlay.classList.remove('show');
    stageReel.classList.remove('show');
    stageCrate.classList.remove('hide');
    openBtn.style.display = 'block';
    updateOpenState();
  });

  loadCurrentCase();
  updateOpenState();
  renderPrizeShowcase();
  renderGallery();
})();
</script>
</body>
</html>
